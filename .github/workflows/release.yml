name: Release

# Si parte da un tag: aggiorna "version" in package.json, src-tauri/Cargo.toml e
# src-tauri/tauri.conf.json, committa, poi
#   git tag -a v0.2.0 -m "Granello 0.2.0" && git push origin main v0.2.0
# Il workflow crea la release IN BOZZA con i DMG per Mac, l'AppImage per Linux,
# l'installer per Windows e latest.json. Le app installate
# leggono releases/latest/download/latest.json, che vede solo le release
# pubblicate: nessuna si aggiorna finché la bozza non viene pubblicata a mano.
#
# Secret richiesti: TAURI_SIGNING_PRIVATE_KEY e TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# (chiave privata dell'updater; copia nel password manager di David).

#
# In una pull request che tocca il workflow o la configurazione di build, le build
# girano lo stesso (artefatti scaricabili dalla pagina del run), senza release.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/tauri*.conf.json
      - scripts/build-ffmpeg.sh

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Il tag corrisponde alle versioni, la chiave pubblica c'è
        id: version
        run: |
          PACKAGE="$(jq -r .version package.json)"
          CONF="$(jq -r .version src-tauri/tauri.conf.json)"
          CARGO="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          # in una pull request non c'è un tag: vale la versione di package.json
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$PACKAGE"; fi
          for v in "$PACKAGE" "$CONF" "$CARGO"; do
            if [ "$v" != "$VERSION" ]; then
              echo "::error::Il tag $GITHUB_REF_NAME non corrisponde alle versioni (package.json $PACKAGE, tauri.conf.json $CONF, Cargo.toml $CARGO)"
              exit 1
            fi
          done
          if [ -z "$(jq -r '.plugins.updater.pubkey // empty' src-tauri/tauri.conf.json)" ]; then
            echo "::error::Manca la chiave pubblica dell'updater in src-tauri/tauri.conf.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dipendenze
        run: pnpm install --frozen-lockfile

      # nelle pull request li fa già il workflow "Controlli"
      - name: Controlli
        if: github.ref_type == 'tag'
        run: pnpm check

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            label: macOS-arm64
            arch: aarch64
            triple: aarch64-apple-darwin
          - os: macos-15-intel # Mac Intel, supportato da GitHub fino all'autunno 2027
            label: macOS-intel
            arch: x86_64
            triple: x86_64-apple-darwin
          # la glibc più vecchia possibile: l'AppImage gira sulle distribuzioni da lì in poi
          - os: ubuntu-22.04
            label: linux-x86_64
            arch: x86_64
            triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            label: windows-x86_64
            arch: x86_64
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Librerie di sistema
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libasound2-dev patchelf cmake

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dipendenze
        run: pnpm install --frozen-lockfile

      # ffmpeg ridotto incluso nell'app: si ricompila solo quando cambia lo script
      - name: Cache di ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ matrix.triple }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Strumenti per compilare ffmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make diffutils curl tar xz mingw-w64-x86_64-gcc

      - name: ffmpeg
        if: runner.os != 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh ${{ matrix.triple }}

      - name: ffmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: scripts/build-ffmpeg.sh ${{ matrix.triple }}

      # Gli artefatti dell'updater (firmati: .app.tar.gz, AppImage, installer) si
      # creano solo qui, così una build locale non chiede la chiave privata.
      - name: Build
        shell: bash # su Windows PowerShell toglierebbe le virgolette del JSON passato a pnpm.cmd
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.ffmpeg.conf.json --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: ffmpeg è nel pacchetto
        shell: bash
        run: |
          ls -la src-tauri/target/release/ffmpeg*
          if [ "$RUNNER_OS" = macOS ]; then test -x src-tauri/target/release/bundle/macos/Granello.app/Contents/MacOS/ffmpeg; fi

      - name: Nomi degli artefatti
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          LABEL: ${{ matrix.label }}
          ARCH: ${{ matrix.arch }}
        run: |
          BUNDLE=src-tauri/target/release/bundle
          mkdir artifacts
          case "$RUNNER_OS" in
            macOS)
              mv "$BUNDLE"/dmg/*.dmg "artifacts/Granello-$VERSION-$LABEL.dmg"
              mv "$BUNDLE"/macos/Granello.app.tar.gz "artifacts/Granello-$VERSION-$ARCH.app.tar.gz"
              mv "$BUNDLE"/macos/Granello.app.tar.gz.sig "artifacts/Granello-$VERSION-$ARCH.app.tar.gz.sig"
              ;;
            Linux)
              mv "$BUNDLE"/appimage/*.AppImage "artifacts/Granello-$VERSION-$LABEL.AppImage"
              mv "$BUNDLE"/appimage/*.AppImage.sig "artifacts/Granello-$VERSION-$LABEL.AppImage.sig"
              ;;
            Windows)
              mv "$BUNDLE"/nsis/*-setup.exe "artifacts/Granello-$VERSION-$LABEL-setup.exe"
              mv "$BUNDLE"/nsis/*-setup.exe.sig "artifacts/Granello-$VERSION-$LABEL-setup.exe.sig"
              ;;
          esac
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: granello-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: [check, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tutta la storia e i tag, per trovare la release precedente

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Il manifest che le app installate leggono per aggiornarsi.
      - name: latest.json
        env:
          VERSION: ${{ needs.check.outputs.version }}
          BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          entry() {
            jq -n --arg sig "$(cat "artifacts/Granello-$VERSION-$1.sig")" \
              --arg url "$BASE/Granello-$VERSION-$1" '{signature: $sig, url: $url}'
          }
          jq -n --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson arm "$(entry aarch64.app.tar.gz)" --argjson intel "$(entry x86_64.app.tar.gz)" \
            --argjson linux "$(entry linux-x86_64.AppImage)" --argjson windows "$(entry windows-x86_64-setup.exe)" \
            '{version: $version, pub_date: $date, platforms: {"darwin-aarch64": $arm, "darwin-x86_64": $intel, "linux-x86_64": $linux, "windows-x86_64": $windows}}' \
            > artifacts/latest.json
          cat artifacts/latest.json

      # Bozza delle note: i commit dal tag precedente. Si riscrivono prima di pubblicare.
      - name: Note dai commit
        run: |
          PREVIOUS="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          RANGE="${PREVIOUS:+$PREVIOUS..}$GITHUB_REF_NAME"
          {
            echo "<!-- Bozza generata dai commit ($RANGE): riscrivere prima di pubblicare. -->"
            echo
            git log --no-merges --pretty='- %s' "$RANGE"
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Granello ${{ needs.check.outputs.version }}
          body_path: notes.md
          draft: true
          files: artifacts/*
          fail_on_unmatched_files: true
