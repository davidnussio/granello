[package]
name = "granello"
version = "0.2.6"
description = "Note di meeting arricchite dall'AI, trascrizione locale."
authors = ["David Nussio"]
license = "MIT"
edition = "2021"

[lib]
name = "granello_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rrule = "0.13"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "1"
log = "0.4"
cpal = "0.18"
parking_lot = "0.12"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
sys-locale = "0.3.2"
tauri-plugin-dialog = "2"
symphonia = { version = "0.5.4", features = ["aac", "alac", "isomp4", "mp3", "aiff", "caf"] }
base64 = "0.22"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.14", features = ["metal"] }
keyring = { version = "3", features = ["apple-native"] }
# Rubrica del Mac (Contacts.framework): solo lettura, per proporre nomi ed email.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSError", "NSPredicate"] }
objc2-contacts = { version = "0.3", default-features = false, features = ["std", "block2", "CNContact", "CNContactStore", "CNContactFetchRequest", "CNLabeledValue", "CNContact_Predicates", "CNContactFormatter"] }
block2 = "0.6"

# Fuori da macOS whisper.cpp gira in CPU.
[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.14" }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# PulseAudio (anche quello offerto da PipeWire) espone il "monitor" dell'uscita: l'audio di
# sistema. Il client è in Rust puro, non servono librerie di sistema.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
